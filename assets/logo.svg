<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128">
  <defs>
    <!-- Adwaita multi-layer drop shadow for the front window -->
    <filter id="winShadow" x="-30%" y="-25%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Deep shadow for the green badge -->
    <filter id="badgeShadow" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#065f38" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#065f38" flood-opacity="0.22" />
    </filter>

    <!-- Soft volumetric shadow for the dynamic arrow -->
    <filter id="arrowShadow" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#065f38" flood-opacity="0.22" />
    </filter>

    <!-- Pill gradients -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbe1eb" />
      <stop offset="100%" stop-color="#c6cfdc" />
    </linearGradient>

    <linearGradient id="backPillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dee3ed" />
      <stop offset="100%" stop-color="#d0d7e4" />
    </linearGradient>

    <!-- Adwaita emerald green for badge -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ec27e" />
      <stop offset="100%" stop-color="#1b9754" />
    </linearGradient>

    <!-- Continuous 3D Volume Gradient (matches fk5mX9V9ax: lime highlight to deep emerald) -->
    <linearGradient id="arrow3DGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="22%" stop-color="#4ade80" />
      <stop offset="55%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Front window surface gradient -->
    <linearGradient id="frontWinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <!-- Back Window (Square, Before) -->
  <rect x="50" y="50" width="320" height="244" fill="#f2f5f9" stroke="#e1e6ee" stroke-width="1.5" />
  <rect x="75" y="76" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="145" y="76" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="215" y="76" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="285" y="76" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="75" y="116" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="145" y="116" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="215" y="116" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="285" y="116" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="75" y="156" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="145" y="156" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="215" y="156" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="285" y="156" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="75" y="196" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="145" y="196" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="215" y="196" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="285" y="196" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="75" y="236" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="145" y="236" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="215" y="236" width="58" height="28" rx="6" fill="url(#backPillGrad)" />
    <rect x="285" y="236" width="58" height="28" rx="6" fill="url(#backPillGrad)" />

  <!-- Front Window (Rounded, After, with Libadwaita Drop Shadow) -->
  <rect x="142" y="180" width="320" height="244" rx="32" ry="32" fill="url(#frontWinGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#winShadow)" />
  <rect x="167" y="206" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="237" y="206" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="307" y="206" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="377" y="206" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="167" y="246" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="237" y="246" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="307" y="246" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="377" y="246" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="167" y="286" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="237" y="286" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="307" y="286" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="377" y="286" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="167" y="326" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="237" y="326" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="307" y="326" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="377" y="326" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="167" y="366" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="237" y="366" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="307" y="366" width="58" height="28" rx="6" fill="url(#pillGrad)" />
    <rect x="377" y="366" width="58" height="28" rx="6" fill="url(#pillGrad)" />

  <!-- Original Green Checkmark Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="302.0" cy="302.0" r="54" fill="url(#greenGrad)" />
    <path d="M 283.0 304.0 L 296.0 317.0 L 322.0 289.0" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Balanced Dynamic Curved Arrow -->
  
  <g transform="translate(205, 200) rotate(140) scale(1.5)" filter="url(#arrowShadow)">
    <path d="M 0 -52 C 2 -50, 35 -18, 38 -15 C 40 -12, 38 -10, 32 -11 L 18 -11 C 16 12, 19 34, 25 50 C 26 53, 23 54, 21 52 C 9 40, -5 24, -13 4 C -16 -4, -18 -8, -18 -11 L -32 -11 C -38 -10, -40 -12, -38 -15 C -35 -18, -2 -50, 0 -52 Z" fill="url(#arrow3DGrad)" stroke="#15803d" stroke-width="0.8" stroke-linejoin="round" />
  </g>
</svg>