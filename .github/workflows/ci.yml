name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check upstream code generation consistency
        run: |
          pnpm run check-style
          git diff --exit-code

  ego-lint:
    name: EGO Reviewer Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout gnome-extension-reviewer
        uses: actions/checkout@v7
        with:
          repository: ZviBaratz/gnome-extension-reviewer
          # Pinned: the tool's `main` has broken this job twice - an unbound
          # variable on the "may pass with comments" path (any single warning
          # aborted the job) and, before that, a grep that fails the step under
          # `set -e`. Bump deliberately and re-read the verdict logic when you do.
          ref: v0.1.31
          path: .ego-lint

      - name: Install GLib schema compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev-bin

      - name: Run ego-lint compliance checks
        run: |
          # Upstream bug in the pinned release: under `set -eo pipefail` the
          # verdict's `grep "^WARN|"` exits 1 when an extension has no warnings at
          # all, which fails the step before the verdict is printed. Tolerate the
          # empty result while keeping the count fed by the pipeline.
          sed -i -e 's/grep "\^WARN|" "\$RESULTS_FILE" | cut/grep "\^WARN|" "\$RESULTS_FILE" 2>\/dev\/null | cut/' \
                 -e 's/| sort -u | wc -l)/| sort -u | wc -l || true)/' \
                 .ego-lint/skills/ego-lint/scripts/ego-lint.sh
          bash .ego-lint/ego-lint --show all src/

  test:
    name: Unit Tests (GJS + Jasmine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-dev-bin gettext meson ninja-build

      - name: Install jasmine-gjs
        run: |
          git clone --depth 1 https://github.com/ptomato/jasmine-gjs.git /tmp/jasmine-gjs
          meson setup /tmp/jasmine-gjs/build /tmp/jasmine-gjs --prefix=/usr
          sudo ninja -C /tmp/jasmine-gjs/build install

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jasmine unit tests
        run: pnpm test

  pack:
    name: Extension Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gettext libglib2.0-dev-bin

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack extension
        run: pnpm run pack

      - name: Verify package with Shexli (EGO analyzer)
        run: pnpm run shexli

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: window-nativizer-extension
          path: dist/*.zip
          if-no-files-found: error
